name: Import existing files

on:
  push:
    branches: [main]
    paths:
      - '.import/trigger.txt'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Import staged project files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/repo-import
          mkdir -p /tmp/repo-import
          cat .import/part-*.b64 | base64 -d > /tmp/archive.tar.xz
          xz -t /tmp/archive.tar.xz
          tar -xJf /tmp/archive.tar.xz -C /tmp/repo-import
          rsync -a --delete --exclude='.git/' /tmp/repo-import/ ./
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Import existing project files into structured repository'
          git push origin HEAD:main
